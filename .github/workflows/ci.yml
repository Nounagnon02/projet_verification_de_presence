name: CI

# Etages 1 a 3 du plan de tests §6.1. Les etages 4 (Playwright), 5 (ZAP) et
# 6 (k6) exigent des services longs a demarrer : ils sont declares dans des
# fichiers separes, declenches sur pull request et non a chaque poussee.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Etage 1 — Lint et types ────────────────────────────────────────────────
  lint:
    name: Lint et types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, mbstring, intl, gd, zip
          # PCOV plutot que Xdebug : nettement plus rapide, et seule la
          # couverture nous interesse ici, pas le debogage pas a pas.
          coverage: pcov

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dependances PHP
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress

      # Une classe qui ne compile pas ne fait pas echouer « artisan list » :
      # elle disparait simplement du registre. C'est ainsi que la commande
      # qr:clean-expired avait cesse d'exister sans que rien ne le signale.
      - name: Syntaxe PHP
        working-directory: backend
        run: make lint

      - name: Style PHP
        working-directory: backend
        run: ./vendor/bin/pint --test
        continue-on-error: true

      - name: Dependances frontend
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Dependances mobile
        working-directory: mobile-app
        run: npm ci --legacy-peer-deps

      - name: Types mobile
        working-directory: mobile-app
        run: npm run ts:check

  # ─── Etage 2 — Tests unitaires et couverture ────────────────────────────────
  backend:
    name: Tests backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: presence_uac_test
        ports: ['55433:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, mbstring, intl, gd, zip
          coverage: pcov

      - name: Dependances
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Environnement de test
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrations
        working-directory: backend
        run: php artisan migrate --force
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 55433
          DB_DATABASE: presence_uac_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

      - name: Suite
        working-directory: backend
        run: php artisan test
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 55433
          DB_DATABASE: presence_uac_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

      # Non bloquant : aucun seuil n'a encore ete mesure cote backend, faute de
      # pilote de couverture en local. La premiere mesure fixera le cliquet.
      - name: Couverture
        working-directory: backend
        run: php artisan test --coverage
        continue-on-error: true
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 55433
          DB_DATABASE: presence_uac_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

  frontend:
    name: Tests frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - working-directory: frontend
        run: npm ci

      # Les seuils de couverture sont un CLIQUET pose au niveau mesure (30 % de
      # lignes), pas la cible de 70 % du memoire §2.1.3. Ils sont bloquants a ce
      # titre : ils interdisent la regression.
      - name: Suite et couverture
        working-directory: frontend
        run: npm run test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: couverture-frontend
          path: frontend/coverage/
          retention-days: 14

  mobile:
    name: Tests mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - working-directory: mobile-app
        run: npm ci --legacy-peer-deps

      - name: Suite et couverture
        working-directory: mobile-app
        run: npm run test:ci

  # ─── Etage 5 — Dependances vulnerables ──────────────────────────────────────
  audit:
    name: Audit des dependances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: composer audit
        working-directory: backend
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          composer audit

      # Non bloquant en l'etat : « npm audit » signale deja 10 vulnerabilites,
      # dont 8 de niveau eleve. Les traiter est un chantier a part ; le rendre
      # bloquant tout de suite arreterait la chaine sans que personne ne puisse
      # avancer. A basculer en bloquant une fois le stock resorbe.
      - name: npm audit frontend
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: npm audit mobile
        working-directory: mobile-app
        run: npm audit --audit-level=high
        continue-on-error: true
