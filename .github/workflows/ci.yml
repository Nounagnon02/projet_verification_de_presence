name: CI

# Etages 1 a 3 du plan de tests §6.1, plus le rejeu du harnais IA.
#
# Les etages qui demarrent des services longs vivent dans des fichiers separes :
#   e2e.yml           Playwright, sur pull request (pile locale, jamais la prod)
#   securite-zap.yml  passe OWASP ZAP, manuelle
#   charge-k6.yml     campagne LOAD-01, manuelle
# Cet en-tete les annoncait deja alors qu'aucun n'existait.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Etage 1 — Lint et types ────────────────────────────────────────────────
  lint:
    name: Lint et types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, mbstring, intl, gd, zip
          # PCOV plutot que Xdebug : nettement plus rapide, et seule la
          # couverture nous interesse ici, pas le debogage pas a pas.
          coverage: pcov

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dependances PHP
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress

      # Une classe qui ne compile pas ne fait pas echouer « artisan list » :
      # elle disparait simplement du registre. C'est ainsi que la commande
      # qr:clean-expired avait cesse d'exister sans que rien ne le signale.
      - name: Syntaxe PHP
        working-directory: backend
        run: make lint

      - name: Style PHP
        working-directory: backend
        run: ./vendor/bin/pint --test
        continue-on-error: true

      # Niveau 5 avec baseline : les ~300 constats anterieurs (proprietes
      # Eloquent non typees pour l'essentiel) sont enregistres dans
      # phpstan-baseline.neon, et tout NOUVEAU constat echoue la chaine. C'est
      # un cliquet, comme les seuils de couverture : il ne se desserre pas.
      - name: Analyse statique (PHPStan)
        working-directory: backend
        run: ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Dependances frontend
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      # 229 lignes de TypeScript (l'empreinte anti-fraude du navigateur) n'etaient
      # ni lintees ni verifiees. Le controle des types a aussitot trouve un type de
      # bibliotheque invente et une option inexistante.
      - name: Types frontend
        working-directory: frontend
        run: npm run ts:check

      - name: Dependances mobile
        working-directory: mobile-app
        run: npm ci --legacy-peer-deps

      - name: Types mobile
        working-directory: mobile-app
        run: npm run ts:check

  # ─── Etage 2 — Tests unitaires et couverture ────────────────────────────────
  backend:
    name: Tests backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: presence_uac_test
        ports: ['55433:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, mbstring, intl, gd, zip
          coverage: pcov

      - name: Dependances
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Environnement de test
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrations
        working-directory: backend
        run: php artisan migrate --force
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 55433
          DB_DATABASE: presence_uac_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

      - name: Suite
        working-directory: backend
        run: php artisan test
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 55433
          DB_DATABASE: presence_uac_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

      # Non bloquant : aucun seuil n'a encore ete mesure cote backend, faute de
      # pilote de couverture en local. La premiere mesure fixera le cliquet.
      - name: Couverture
        working-directory: backend
        run: php artisan test --coverage
        continue-on-error: true
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 55433
          DB_DATABASE: presence_uac_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

  frontend:
    name: Tests frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - working-directory: frontend
        run: npm ci

      # Les seuils de couverture sont un CLIQUET pose au niveau mesure (30 % de
      # lignes), pas la cible de 70 % du memoire §2.1.3. Ils sont bloquants a ce
      # titre : ils interdisent la regression.
      - name: Suite et couverture
        working-directory: frontend
        run: npm run test:coverage

      # Une erreur de construction (import circulaire, asset introuvable) n'etait
      # decouverte qu'au deploiement Vercel.
      - name: Construction
        working-directory: frontend
        run: npm run build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: couverture-frontend
          path: frontend/coverage/
          retention-days: 14

  mobile:
    name: Tests mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - working-directory: mobile-app
        run: npm ci --legacy-peer-deps

      - name: Suite et couverture
        working-directory: mobile-app
        run: npm run test:ci

  # ─── Etage 5 — Dependances vulnerables ──────────────────────────────────────
  audit:
    name: Audit des dependances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: composer audit
        working-directory: backend
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          composer audit

      # Bloquant : le stock a ete resorbe (13 vulnerabilites, dont 9 elevees,
      # corrigees par « npm audit fix » le 2026-09-18). La marche interdit
      # desormais d'en reintroduire.
      - name: npm audit frontend
        working-directory: frontend
        run: npm audit --audit-level=high

      # Non bloquant, et ce n'est pas de la complaisance : les vulnerabilites
      # restantes sont dans l'outillage de construction d'Expo (Metro, CLI), et
      # le seul « correctif » que npm propose est un retour a Expo 46. Elles ne
      # sont pas embarquees dans l'application livree.
      - name: npm audit mobile
        working-directory: mobile-app
        run: npm audit --audit-level=high
        continue-on-error: true

  # ─── Etage 3 bis — Extraction IA, en rejeu ──────────────────────────────────
  ia:
    name: Harnais IA (rejeu des reponses enregistrees)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, gd, zip

      - name: Dependances
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Environnement
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      # Les PDF du corpus ne sont pas versionnes : le generateur est la source
      # de verite et les reconstruit en quelques secondes.
      - name: Corpus
        working-directory: backend
        run: php ../tests/ia/generer-corpus.php

      # Mode rejeu : aucune cle d'API, aucun quota consomme, resultat
      # deterministe. Le mode « --reel » reste manuel, pour les campagnes.
      - name: Rejeu
        working-directory: backend
        run: php ../tests/ia/evaluer.php --provider=gemini
