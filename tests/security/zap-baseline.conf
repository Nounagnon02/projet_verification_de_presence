# OWASP ZAP — passe « baseline » sur l'API SGP-UAC
#
# Format : <id-de-regle>\t<WARN|IGNORE|FAIL>\t<commentaire>
# Toute regle absente de ce fichier reste au niveau par defaut (WARN).
#
# Chaque IGNORE porte une justification. Un fichier de suppressions sans motif
# devient vite un fichier ou l'on range tout ce qui derange, et la passe ne
# prouve plus rien.
#
# Usage :
#   docker run --rm --network host \
#     -v "$(pwd)/tests/security:/zap/wrk/:rw" \
#     ghcr.io/zaproxy/zaproxy:stable zap-api-scan.py \
#     -t http://localhost:8000/api/docs/json -f openapi \
#     -c zap-baseline.conf -r rapport-zap.html -J rapport-zap.json
#
# La cible est la description OpenAPI (/api/docs/json) et non la racine : c'est
# une API sans interface serveur, un parcours de spider n'y trouverait rien.

# ─── Sans objet : API Bearer sans etat, aucun cookie de session ───────────────
# CDC §9.1 annonce une « protection CSRF sur tous les formulaires ». L'API est
# stateless et authentifiee par jeton Bearer : il n'y a pas de cookie de session
# a rejouer, donc pas de surface CSRF. C'est le CDC qu'il faut corriger.
10202	IGNORE	Absence de jeton anti-CSRF — API stateless a jeton Bearer, sans cookie de session
10054	IGNORE	Cookie sans attribut SameSite — l'API ne pose aucun cookie

# ─── Traite ailleurs, par des tests deterministes ─────────────────────────────
# Ces points sont couverts par la suite PHPUnit, ou l'assertion est exacte
# plutot que probabiliste.
10021	IGNORE	X-Content-Type-Options — verifie par le test du middleware SecurityHeaders
10020	IGNORE	X-Frame-Options — idem
10035	IGNORE	Strict-Transport-Security — pose par ForceHttps, absent en local par construction

# ─── Bruit sur une API JSON ───────────────────────────────────────────────────
10015	IGNORE	Absence de Cache-Control — les reponses JSON authentifiees ne sont pas mises en cache par le navigateur
10096	IGNORE	Horodatage divulgue — les dates d'evenement et heures de scan sont la charge utile attendue
10109	IGNORE	Champ de mot de passe en autocompletion — aucune page HTML servie par l'API

# ─── Bloquant : ces regles doivent faire echouer la passe ─────────────────────
# Ce sont les categories OWASP que le memoire §4.3 revendique comme PASSE.
# Les laisser en WARN reviendrait a publier un resultat que rien ne garantit.
40018	FAIL	Injection SQL
40012	FAIL	Cross-Site Scripting reflechi
40014	FAIL	Cross-Site Scripting persistant
40016	FAIL	Cross-Site Scripting persistant — prise
40017	FAIL	Cross-Site Scripting persistant — declenchement
90019	FAIL	Injection de code cote serveur
90020	FAIL	Injection de commande systeme
40003	FAIL	Injection d'en-tete HTTP
6	FAIL	Parcours de repertoires
7	FAIL	Inclusion de fichier distant
90022	FAIL	Divulgation d'application (trace d'exception)
10023	FAIL	Divulgation d'information — message d'erreur detaille
2	FAIL	Fuite d'information privee
