      summary: Enregistrer la présence d'un étudiant refusé à tort
      description: |
        Rattrape un étudiant présent en salle dont le scan a été refusé (GPS
        imprécis, Wi-Fi mal capté). L'étudiant et la séance viennent du refus ;
        l'heure retenue est celle de la tentative. Motif obligatoire, opération
        tracée au journal d'audit. Refusé si l'étudiant a déjà une présence à
        cette séance (elle se tranche dans la file de validation).
      security:
        - sanctum: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motif]
              properties:
                motif: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Présence enregistrée (statut valide)
        '404':
          description: Scan refusé introuvable (ou d'un autre établissement)
        '409':
          description: L'étudiant a déjà une présence à cette séance
        '422':
          description: Motif manquant, séance inconnue ou annulée, étudiant non inscrit

